<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozy Medieval Zombies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The loading shell (docs/23, step 1): on screen at the first paint, before any script runs.
       src/boot.js moves the bar and the line, names a failure, and hides it when the game is up. -->
  <div id="loading">
    <div class="box">
      <h1>Cozy Medieval Zombies</h1>
      <div class="sub">a village, seen whole, overrun</div>
      <div class="bar"><div class="fill"></div></div>
      <div class="line">Waking the village…</div>
      <div class="error" hidden>
        <p class="msg"></p>
        <button type="button">Reload</button>
      </div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="ui">
      <div id="hud" hidden></div>
      <div id="prompt" hidden></div>
      <div id="inventory" hidden></div>
      <div id="screens" hidden></div>
    </div>
    <div id="debug"></div>
  </div>
  <!-- The game's site (docs/38, #111): everything out of a world is a full-width page, never a box over one.
       src/ui/screens.js renders the out-of-world screens into #site-page; the game's own screens stay in #screens. -->
  <div id="site" hidden>
    <div class="site-bg"></div>
    <header class="site-head">
      <div class="wordmark" role="img" aria-label="Cozy Medieval Zombies">
        <img class="wm-tree wm-tree-l" src="data/art/trees/tree_oak_L_orange.png" alt="">
        <img class="wm-tree wm-tree-l2" src="data/art/trees/tree_spire_M_red.png" alt="">
        <img class="wm-tree wm-tree-r" src="data/art/trees/tree_oak_L_yellow.png" alt="">
        <img class="wm-tree wm-tree-r2" src="data/art/trees/tree_oak_M_red.png" alt="">
        <span class="wm-line wm-small">Cozy Medieval</span>
        <span class="wm-line wm-big">Zombies</span>
      </div>
      <nav class="site-nav">
        <button class="kit-button" data-go="title">Home</button>
        <button class="kit-button" data-go="about">About</button>
        <button class="kit-button" data-go="controls">Controls</button>
        <button class="kit-button play" data-go="worlds">Play</button>
        <button class="kit-button" data-go="identities">Identities</button>
        <button class="kit-button" data-go="settings">Settings</button>
        <a class="kit-button" href="https://cmzgame.github.io/cmz-wiki/" target="_blank" rel="noopener">Wiki</a>
      </nav>
    </header>
    <main id="site-page"></main>
    <footer class="site-foot">A village of the dead. Keep the shutters closed. · <a href="https://cmzgame.github.io/cmz-wiki/" target="_blank" rel="noopener">The wiki</a></footer>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
