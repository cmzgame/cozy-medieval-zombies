<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozy Medieval Zombies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <!-- The Canvas 2D renderer, for a side-by-side on the G key until the WebGL one is accepted. -->
    <canvas id="game2d" width="960" height="540" style="position: absolute; visibility: hidden;"></canvas>
    <div id="ui">
      <div id="hud" hidden></div>
      <div id="prompt" hidden></div>
    </div>
    <div id="debug"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
